name: MyTemplate Quality Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit
          pip install pytest-playwright

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run application tests with coverage
        run: |
          pytest tests \
            --cov=appname \
            --cov-report=term-missing \
            --cov-report=html:coverage_report \
            --junitxml=test-reports/results.xml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run UI tests
        run: |
          python manage.py runserver --host 0.0.0.0 --port 5000 > flask.log 2>&1 &
          SERVER_PID=$!

          sleep 10

          echo "Checking Flask application..."
          curl --fail http://127.0.0.1:5000

          echo "Running UI tests..."
          pytest tests/test_ui.py

          kill $SERVER_PID

      - name: Run Flake8
        continue-on-error: true
        run: |
          flake8 appname tests > flake8-report.txt

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r appname -f txt -o bandit-report.txt

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage_report/
            test-reports/
            flake8-report.txt
            bandit-report.txt